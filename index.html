<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿諺的新聞智庫 v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --paper: #FDFBF7; --ink: #2C2C2C; --accent: #8B0000; --active: #E0DACE; --highlight: #FFF9E6; }
        body { background: var(--paper); font-family: 'Noto Sans TC', sans-serif; color: var(--ink); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header { border-top: 5px solid var(--ink); padding: 20px 0; margin-bottom: 20px; position: relative; }
        .config-btn { position: absolute; right: 0; top: 10px; cursor: pointer; border: 1px solid #ccc; padding: 5px 15px; border-radius: 20px; background: white; font-size: 0.85rem; }
        .header h1 { font-family: 'Noto Serif TC', serif; font-size: 2.8rem; margin: 0; text-align: center; }

        /* 前台管理面板 */
        #config-panel { display: none; background: white; border: 2px solid var(--ink); padding: 20px; margin-bottom: 30px; border-radius: 8px; box-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .config-section { margin-bottom: 15px; }
        .tag-input { padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; width: 200px; }
        .keyword-tag { display: inline-block; background: var(--active); padding: 2px 8px; border-radius: 4px; margin: 3px; font-size: 0.85rem; }
        .keyword-tag span { margin-left: 5px; cursor: pointer; color: var(--accent); font-weight: bold; }

        /* 分頁選單 */
        .tabs { display: flex; flex-wrap: wrap; justify-content: center; border-bottom: 1px solid var(--ink); margin-bottom: 30px; padding: 10px 0; position: sticky; top: 0; background: var(--paper); z-index: 100; }
        .tab-btn { background: none; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; font-size: 1rem; color: #666; transition: 0.3s; position: relative; }
        .tab-btn.active { color: var(--accent); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 20%; width: 60%; height: 3px; background: var(--accent); }
        
        /* 新聞卡片 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { border: 1px solid #e0e0e0; background: white; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; object-fit: cover; background: #f0f0f0; }
        .card-body { padding: 15px; flex-grow: 1; }
        .card h3 { font-size: 1.1rem; margin: 10px 0; font-family: 'Noto Serif TC', serif; }
        .card h3 a { color: var(--ink); text-decoration: none; }
        .card .source { font-size: 0.75rem; color: var(--accent); font-weight: bold; }
        
        .highlight-mark { background: yellow; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="config-btn" onclick="toggleConfig()">🔍 精準追蹤設定</button>
        <h1>阿諺的新聞智庫</h1>
        <p>自定義新聞流｜本地同步</p>
    </div>

    <div id="config-panel">
        <div class="config-section">
            <h4 style="margin:0 0 10px 0;">🎯 加強追蹤關鍵字 (即時過濾)</h4>
            <div id="my-keywords" style="margin-bottom: 10px;"></div>
            <input type="text" id="keyword-in" class="tag-input" placeholder="輸入關鍵字按確認...">
            <button onclick="addKeyword()" style="padding: 5px 15px;">確認</button>
            <p style="font-size: 0.8rem; color: #888; margin-top: 5px;">* 這些關鍵字會幫助你從新聞海中「標記」出你最感興趣的內容。</p>
        </div>
        <hr>
        <div style="text-align: right;">
            <button onclick="toggleConfig()" style="background: var(--ink); color: white; border: none; padding: 5px 20px; border-radius: 4px; cursor: pointer;">完成設定</button>
        </div>
    </div>

    <div class="tabs" id="tab-bar">
        <button class="tab-btn active" onclick="showTab('在地')">在地</button>
        <button class="tab-btn" onclick="showTab('文化')">文化</button>
        <button class="tab-btn" onclick="showTab('科技')">科技</button>
        <button class="tab-btn" onclick="showTab('國際')">國際</button>
        <button class="tab-btn" onclick="showTab('政治')">政治</button>
        <button class="tab-btn" onclick="showTab('產業')">產業</button>
        <button class="tab-btn" onclick="showTab('收藏')">💖 收藏<span id="fav-count">0</span></button>
    </div>

    <div id="news-content">
        <p style="text-align: center; padding: 50px;">載入中...</p>
    </div>
</div>

<script>
    let allData = {};
    let favorites = JSON.parse(localStorage.getItem('news_favs') || '[]');
    let myKeywords = JSON.parse(localStorage.getItem('my_keywords') || '["桃園", "採訪", "吐瓦魯"]');
    let currentCat = '在地';

    async function init() {
        try {
            const res = await fetch(`news_data.json?t=${new Date().getTime()}`);
            allData = await res.json();
            renderKeywords();
            updateFavCount();
            showTab('在地');
        } catch (e) {
            document.getElementById('news-content').innerHTML = "請先執行 GitHub Actions 更新資料。";
        }
    }

    // 面板控制
    function toggleConfig() {
        const p = document.getElementById('config-panel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    // 關鍵字管理
    function renderKeywords() {
        const div = document.getElementById('my-keywords');
        div.innerHTML = myKeywords.map((k, i) => `
            <span class="keyword-tag">${k}<span onclick="removeKeyword(${i})">×</span></span>
        `).join('');
    }

    function addKeyword() {
        const val = document.getElementById('keyword-in').value.trim();
        if (val && !myKeywords.includes(val)) {
            myKeywords.push(val);
            localStorage.setItem('my_keywords', JSON.stringify(myKeywords));
            document.getElementById('keyword-in').value = '';
            renderKeywords();
            showTab(currentCat); // 即時重整內容
        }
    }

    function removeKeyword(i) {
        myKeywords.splice(i, 1);
        localStorage.setItem('my_keywords', JSON.stringify(myKeywords));
        renderKeywords();
        showTab(currentCat);
    }

    // 渲染邏輯
    function showTab(cat) {
        currentCat = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(cat)));
        
        const container = document.getElementById('news-content');
        let html = '<div class="grid">';

        const items = (cat === '收藏') ? favorites : (allData[cat] || []);
        
        if (items.length === 0) {
            html += `<p style="grid-column: 1/-1; text-align: center; padding: 50px;">暫無內容。</p>`;
        } else {
            // 這裡實作精準過濾與標記
            items.forEach((item, index) => {
                let isMatch = myKeywords.some(k => item.title.includes(k));
                html += renderCard(item, cat === '收藏', index, isMatch);
            });
        }
        html += '</div>';
        container.innerHTML = html;
    }

    function renderCard(item, isFav, index, isMatch) {
        let displayTitle = item.title;
        if (isMatch) {
            myKeywords.forEach(k => {
                const reg = new RegExp(k, "gi");
                displayTitle = displayTitle.replace(reg, match => `<mark class="highlight-mark">${match}</mark>`);
            });
        }

        return `
            <div class="card" style="${isMatch ? 'border: 2px solid var(--accent); background: var(--highlight);' : ''}">
                <img src="${item.image || 'https://via.placeholder.com/400x200?text=News'}" onerror="this.src='https://via.placeholder.com/400x200?text=News'">
                <div class="card-body">
                    <div class="source">${isMatch ? '⭐ 精準命中 · ' : ''}${item.source} · ${item.time}</div>
                    <h3><a href="${item.link}" target="_blank">${displayTitle}</a></h3>
                    <div class="summary" style="font-size:0.85rem; color:#666;">${item.summary || ""}</div>
                    <div style="margin-top:15px; text-align:right;">
                        <button onclick="toggleFav('${encodeURIComponent(JSON.stringify(item))}')" style="cursor:pointer; border:1px solid #ccc; background:none; padding:3px 10px; border-radius:4px;">
                            ${favorites.some(f => f.link === item.link) ? '❤️ 已收藏' : '🤍 收藏'}
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    function toggleFav(itemStr) {
        const item = JSON.parse(decodeURIComponent(itemStr));
        const idx = favorites.findIndex(f => f.link === item.link);
        if (idx > -1) favorites.splice(idx, 1);
        else favorites.push(item);
        localStorage.setItem('news_favs', JSON.stringify(favorites));
        updateFavCount();
        showTab(currentCat);
    }

    function updateFavCount() {
        document.getElementById('fav-count').innerText = favorites.length;
    }

    init();
</script>

</body>
</html>
