<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Daily - 每日即時新聞</title>
    <style>
        /* 1. 全時深色模式核心樣式 (Force Dark Mode) */
        :root {
            --bg-primary: #121212;
            --bg-surface: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --accent-color: #bb86fc;
            --accent-hover: #9965df;
            --border-color: #333333;
            --danger-color: #ff5c5c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 2. 前台新聞源管理面板樣式 */
        .management-panel {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .management-panel h3 {
            margin-bottom: 15px;
            color: #ffffff;
            font-size: 18px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        input[type="text"] {
            background-color: var(--bg-secondary);
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            flex: 1;
            min-width: 180px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.btn-secondary {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        button.btn-secondary:hover {
            background-color: #444;
        }

        .source-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .source-tag {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .source-tag .remove-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            padding: 0;
        }

        /* 3. 新聞卡片流排版 (RWD) */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .news-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .news-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: var(--bg-secondary);
        }

        .news-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .news-title {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-desc {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        /* 關鍵字標籤樣式 */
        .keyword-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }

        .keyword-tag {
            background-color: #251b35;
            color: var(--accent-color);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #3c255c;
        }

        .news-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .read-more-btn {
            display: block;
            text-align: center;
            background-color: var(--bg-secondary);
            color: var(--accent-color);
            text-decoration: none;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .read-more-btn:hover {
            background-color: var(--accent-color);
            color: #121212;
        }

        .no-news {
            text-align: center;
            grid-column: 1 / -1;
            padding: 4px 0;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h1>📰 Daily News Hub</h1>
            <p style="color: var(--text-secondary); font-size: 14px;">您的個人化深色新聞中心</p>
        </div>
    </header>

    <main class="container">
        <section class="management-panel">
            <h3>⚙️ 新聞來源管理後台</h3>
            <div class="input-group">
                <input type="text" id="source-id-input" placeholder="新聞源 ID (如: techcrunch, bbc-news)">
                <input type="text" id="source-name-input" placeholder="顯示名稱 (如: 科技網, BBC)">
                <button onclick="addNewsSource()">➕ 新增來源</button>
                <button class="btn-secondary" onclick="resetToDefaultSources()">⚡ 重置為預設源</button>
            </div>
            <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 5px;">目前已啟用的新聞源：</div>
            <div class="source-tags-container" id="sources-list-container">
                </div>
        </section>

        <section class="news-grid" id="news-grid-container">
            </section>
    </main>

    <script>
        // ==========================================
        // 核心資料與初始化設定
        // ==========================================
        
        // 初始預設的新聞源 (若 LocalStorage 沒資料時使用)
        const defaultSources = [
            { id: 'techcrunch', name: 'TechCrunch 科技' },
            { id: 'bbc-news', name: 'BBC 國際新聞' },
            { id: 'the-verge', name: 'The Verge 數位' }
        ];

        // 從 LocalStorage 載入使用者的來源，或直接用預設
        let activeSources = JSON.parse(localStorage.getItem('user_news_sources')) || defaultSources;

        // 模擬的新聞 API 資料 (因為 NewsAPI 在前端部署常有跨域或付費限制，這裡提供完整的 Mock 資料確保程式可立即運行)
        // 如果你有真實的 API URL，只需在 fetchNews 替換即可。
        const mockArticles = [
            {
                title: "Next-Gen AI Models Spark Breakthroughs in Quantum Computing Science",
                description: "Scientists have integrated advanced artificial intelligence networks with quantum processors, accelerating complex molecular simulations by a factor of ten.",
                source: { id: "techcrunch", name: "TechCrunch 科技" },
                publishedAt: "2026-05-28T08:00:00Z",
                urlToImage: "https://picsum.photos/id/0/400/250",
                url: "https://example.com/news1"
            },
            {
                title: "Global Clean Energy Shift Hits Record Milestone in Europe",
                description: "Europe official reports reveal solar and wind energy sources generated more electricity than traditional fossil fuels for three consecutive months.",
                source: { id: "bbc-news", name: "BBC 國際新聞" },
                publishedAt: "2026-05-27T14:30:00Z",
                urlToImage: "https://picsum.photos/id/10/400/250",
                url: "https://example.com/news2"
            },
            {
                title: "New Smartphone Display Tech Promises Double Battery Efficiency",
                description: "A leading tech manufacturer unveiled a brand new micro-LED design that slashes power consumption while maintaining maximum brightness under sunlight.",
                source: { id: "the-verge", name: "The Verge 數位" },
                publishedAt: "2026-05-27T11:15:00Z",
                urlToImage: "https://picsum.photos/id/48/400/250",
                url: "https://example.com/news3"
            }
        ];

        // ==========================================
        // 功能 2: 新聞源後台管理邏輯
        // ==========================================
        
        // 渲染管理區塊的標籤
        function renderSourceManager() {
            const container = document.getElementById('sources-list-container');
            container.innerHTML = '';

            if (activeSources.length === 0) {
                container.innerHTML = `<span style="color: var(--danger-color); font-size: 13px;">⚠️ 目前沒有啟用的新聞源，請新增或重置。</span>`;
                return;
            }

            activeSources.forEach((source, index) => {
                container.innerHTML += `
                    <div class="source-tag">
                        <strong>${source.name}</strong> (${source.id})
                        <button class="remove-btn" onclick="deleteSource(${index})" title="刪除此來源">×</button>
                    </div>
                `;
            });
        }

        // 新增新聞源
        function addNewsSource() {
            const idInput = document.getElementById('source-id-input');
            const nameInput = document.getElementById('source-name-input');
            
            const id = idInput.value.trim().toLowerCase();
            const name = nameInput.value.trim();

            if (!id || !name) {
                alert('請完整填入新聞源 ID 與顯示名稱！');
                return;
            }

            // 檢查是否重複
            if (activeSources.some(s => s.id === id)) {
                alert('該新聞源 ID 已存在！');
                return;
            }

            // 寫入陣列與 LocalStorage
            activeSources.push({ id, name });
            localStorage.setItem('user_news_sources', JSON.stringify(activeSources));

            // 清空輸入欄位並刷新
            idInput.value = '';
            nameInput.value = '';
            renderSourceManager();
            fetchAndRenderNews(); // 重新過濾新聞
        }

        // 刪除個別新聞源
        function deleteSource(index) {
            activeSources.splice(index, 1);
            localStorage.setItem('user_news_sources', JSON.stringify(activeSources));
            renderSourceManager();
            fetchAndRenderNews(); // 重新過濾新聞
        }

        // 重置回預設新聞源
        function resetToDefaultSources() {
            activeSources = [...defaultSources];
            localStorage.setItem('user_news_sources', JSON.stringify(activeSources));
            renderSourceManager();
            fetchAndRenderNews();
        }

        // ==========================================
        // 功能 3: 智慧文本自動提取 3-5 個關鍵字
        // ==========================================
        function extractKeywords(title, description) {
            const combinedText = `${title} ${description || ''}`.toLowerCase();
            
            // 移除常見英文標點與特殊符號
            const cleanText = combinedText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'’]/g, " ");
            const words = cleanText.split(/\s+/);

            // 過濾用虛詞/非關鍵字清單 (Stopwords)
            const stopWords = new Set([
                'the', 'a', 'an', 'and', 'but', 'if', 'or', 'because', 'as', 'what', 'which', 'who',
                'he', 'she', 'it', 'they', 'we', 'i', 'you', 'his', 'her', 'their', 'my', 'your',
                'is', 'are', 'was', 'were', 'be', 'been', 'being', 'have', 'has', 'had', 'do', 'does', 'did',
                'in', 'on', 'at', 'to', 'for', 'with', 'about', 'against', 'during', 'before', 'after',
                'that', 'this', 'these', 'those', 'then', 'so', 'than', 'not', 'no', 'just', 'more', 'new', 'reveal', 'spark'
            ]);

            const wordCounts = {};
            words.forEach(word => {
                // 篩選長度大於 3 且不在過濾清單中的高價值名詞/動詞
                if (word.length > 3 && !stopWords.has(word)) {
                    wordCounts[word] = (wordCounts[word] || 0) + 1;
                }
            });

            // 排序字頻
            const sortedWords = Object.keys(wordCounts).sort((a, b) => wordCounts[b] - wordCounts[a]);

            // 動態取出 3 ~ 5 個關鍵字
            // 這裡採用動態計算：如果高頻詞多就拿5個，最少拿3個
            const targetCount = Math.
