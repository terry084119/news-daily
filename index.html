<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新聞智庫 | 列表模式</title>
    <style>
        :root { --paper: #ffffff; --sidebar: #f4f4f4; --accent: #d32f2f; }
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
        .nav-bar { width: 180px; background: var(--sidebar); border-right: 1px solid #ddd; }
        .nav-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #eee; }
        .nav-item:hover { background: #e0e0e0; }
        .nav-item.active { background: #333; color: white; }
        
        .list-container { flex: 1; overflow-y: auto; padding: 20px 40px; }
        .news-card { padding: 15px 0; border-bottom: 1px solid #eee; }
        .news-title { font-size: 1.1rem; font-weight: bold; color: #222; text-decoration: none; }
        .news-meta { font-size: 0.8rem; color: #666; margin-top: 5px; }
        
        #preview-panel { width: 0; transition: 0.3s; border-left: 0; display: flex; flex-direction: column; overflow: hidden; }
        #preview-panel.open { width: 40%; border-left: 2px solid #333; }
        iframe { flex: 1; border: none; }
        .note-box { height: 120px; background: #fffde7; padding: 10px; }
    </style>
</head>
<body>

<div class="nav-bar" id="nav"></div>
<div class="list-container">
    <h2 id="cat-title">請選擇分類</h2>
    <div id="news-list"></div>
</div>
<div id="preview-panel">
    <div style="padding: 10px; background: #eee;">
        <button onclick="document.getElementById('preview-panel').classList.remove('open')">✕ 關閉預覽</button>
        <button onclick="window.open(activeUrl)">🌐 開啟分頁</button>
    </div>
    <iframe id="ifr"></iframe>
    <div class="note-box">
        <textarea id="nt" style="width:100%; height:80px;" oninput="saveN()" placeholder="輸入筆記..."></textarea>
    </div>
</div>

<script>
    let allData = {};
    let activeUrl = "";

    async function load() {
        const r = await fetch('news_data.json?v=' + Date.now());
        allData = await r.json();
        const nav = document.getElementById('nav');
        // 自動生成導航欄
        nav.innerHTML = Object.keys(allData).map(c => 
            `<div class="nav-item" onclick="show('${c}')">${c}</div>`
        ).join('');
        
        // 預設顯示第一個有資料的分類
        const firstCat = Object.keys(allData)[0];
        if(firstCat) show(firstCat);
    }

    function show(c) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        event?.target?.classList?.add('active');
        
        document.getElementById('cat-title').innerText = c;
        const list = document.getElementById('news-list');
        const data = allData[c] || [];
        
        if(data.length === 0) {
            list.innerHTML = "<p>此分類目前沒有 24 小時內的新聞，請確認搜尋關鍵字或等待下次更新。</p>";
            return;
        }

        list.innerHTML = data.map(n => `
            <div class="news-card">
                <a href="${n.link}" target="_blank" class="news-title">${n.title}</a>
                <div class="news-meta">${n.source} · ${n.time} | <span style="cursor:pointer; color:blue;" onclick="prev('${n.link}')">👁️ 預覽</span></div>
            </div>
        `).join('');
    }

    function prev(u) {
        activeUrl = u;
        document.getElementById('preview-panel').classList.add('open');
        document.getElementById('ifr').src = u;
        document.getElementById('nt').value = localStorage.getItem(u) || "";
    }

    function saveN() {
        localStorage.setItem(activeUrl, document.getElementById('nt').value);
    }

    load();
</script>
</body>
</html>
