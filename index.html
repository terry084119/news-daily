<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Daily Pro - 智慧新聞核心</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #161925;
            --bg-input: #1f2336;
            --text-main: #f0f2f5;
            --text-muted: #9aa0b6;
            --accent: #7c4dff;
            --accent-hover: #651fff;
            --success: #00e676;
            --danger: #ff1744;
            --border: #262b42;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 60px; }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }

        /* 全域導覽列 */
        header { background-color: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .nav-main { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        .logo { font-size: 22px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent); }
        .nav-tabs { display: flex; gap: 10px; }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 8px 16px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; background-color: var(--bg-input); }
        .tab-btn.active { color: #fff; background-color: var(--accent); }

        /* 分類導覽列 */
        .category-bar { background-color: #121420; border-bottom: 1px solid var(--border); padding: 12px 0; overflow-x: auto; white-space: nowrap; }
        .category-wrapper { display: flex; gap: 8px; }
        .cat-btn { background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .cat-btn:hover, .cat-btn.active { border-color: var(--accent); color: #fff; background-color: var(--bg-input); }

        /* 主要內容區塊開關 */
        .page-section { display: none; padding: 25px 0; }
        .page-section.active { display: block; }

        /* 新聞卡片網格 */
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .news-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; position: relative; }
        .news-card:hover { transform: translateY(-4px); }
        .news-img { width: 100%; height: 170px; object-fit: cover; background-color: var(--bg-input); }
        .news-content { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
        .news-source { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .news-time { color: var(--text-muted); }
        .news-title { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .news-desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
        
        .kw-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .kw-tag { background-color: var(--bg-input); color: var(--text-main); font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); }
        
        .card-footer { display: flex; gap: 10px; margin-top: auto; }
        .btn-action { flex: 1; text-align: center; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-read { background-color: var(--bg-input); color: #fff; border: 1px solid var(--border); }
        .btn-read:hover { background-color: var(--border); }
        .btn-fav { background-color: rgba(124, 77, 255, 0.1); color: var(--accent); }
        .btn-fav:hover { background-color: var(--accent); color: #fff; }
        .btn-fav.bookmarked { background-color: var(--danger); color: #fff; }

        /* 收藏夾專用筆記區 */
        .note-area { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
        .note-input { width: 100%; background-color: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; resize: vertical; margin-bottom: 6px; }
        .note-input:focus { outline: none; border-color: var(--accent); }

        /* 後台管理面板 */
        .mgmt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .mgmt-grid { grid-template-columns: 1fr; } .news-grid { grid-template-columns: 1fr; } }
        .panel { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .panel h3 { margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .mgmt-form { display: flex; gap: 8px; margin-bottom: 15px; }
        .mgmt-input { background-color: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 6px; flex: 1; }
        .mgmt-select { background-color: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; }
        .btn-add { background-color: var(--success); color: #000; font-weight: 700; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; }
        
        .item-list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 250px; overflow-y: auto; padding: 5px; }
        .item-tag { background-color: var(--bg-input); border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .btn-del { background: none; border: none; color: var(--danger); font-weight: 700; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="container nav-main">
            <div class="logo">📰 NewsDaily<span>Pro</span></div>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchPage('browse')">新聞瀏覽</button>
                <button class="tab-btn" onclick="switchPage('favorites')">我的收藏夾 (<span id="fav-count">0</span>)</button>
                <button class="tab-btn" onclick="switchPage('management')">後台設定</button>
            </div>
        </div>
    </header>

    <div class="category-bar" id="category-bar-zone">
        <div class="container category-wrapper" id="category-buttons-container">
            </div>
    </div>

    <main class="container">
        <section id="page-browse" class="page-section active">
            <h2 id="current-category-title" style="margin-bottom: 20px; font-size: 22px;">Loading...</h2>
            <div class="news-grid" id="browse-news-grid"></div>
        </section>

        <section id="page-favorites" class="page-section">
            <h2 style="margin-bottom: 20px; font-size: 22px;">📁 收藏的新聞與筆記</h2>
            <div class="news-grid" id="favorites-news-grid"></div>
        </section>

        <section id="page-management" class="page-section">
            <h2 style="margin-bottom: 25px; font-size: 22px;">⚙️ 前台系統控制中心</h2>
            <div class="mgmt-grid">
                
                <div class="panel">
                    <h3>📰 新聞來源對應管理</h3>
                    <div class="mgmt-form">
                        <select id="mgmt-src-cat" class="mgmt-select"></select>
                        <input type="text" id="mgmt-src-name" class="mgmt-input" placeholder="新聞源名稱 (如: 中央社─政治)">
                        <button class="btn-add" onclick="addSourceViaMgmt()">新增</button>
                    </div>
                    <div class="item-list" id="mgmt-sources-list"></div>
                </div>

                <div class="panel">
                    <h3>🚫 全域敏感/八卦過濾關鍵字</h3>
                    <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">符合以下字眼的新聞將被系統自動阻斷、踢除。</p>
                    <div class="mgmt-form">
                        <input type="text" id="mgmt-kw-text" class="mgmt-input" placeholder="輸入要阻斷的字眼 (如: 爆料、緋聞)">
                        <button class="btn-add" onclick="addKeywordViaMgmt()">加入</button>
                    </div>
                    <div class="item-list" id="mgmt-keywords-list"></div>
                </div>

            </div>
        </section>
    </main>

    <script>
        // ==========================================
        // 1. 核心資料結構與初始化
        // ==========================================
        const categoryMap = {
            politics: { name: '政治', icon: '⚖️' },
            international: { name: '國際', icon: '🌐' },
            economy: { name: '產經', icon: '📊' },
            tech: { name: '科技', icon: '🚀' },
            life: { name: '生活', icon: '🍕' },
            culture: { name: '文化', icon: '🎨' },
            local: { name: '地方', icon: '🗺️' },
            sports: { name: '運動', icon: '⚾' },
            entertainment: { name: '娛樂', icon: '🎬' }
        };

        // 預設各分類准許的新聞來源
        const defaultSources = {
            politics: ['中央社─政治', '報導者─政治社會'],
            international: ['中央社─國際', '聯合新聞網─全球', 'BBC NEWS中文─國際', '報導者─國際兩岸', '轉角國際'],
            economy: ['經濟日報─產業', '中央社─產經', '報導者─經濟產業'],
            tech: ['中央社─科技', '數位時代'],
            life: ['中央社─生活'],
            culture: ['中央社─文化', '自由藝文網', '聯合新聞網─文教', '報導者─文化生活', 'SHOPPING DESIGN', '典藏ARTouch'],
            local: ['中央社─地方', '自由時報─地方', '聯合新聞網─地方'],
            sports: ['中央社─運動', '自由體育', '運動人', '運動視界'],
            entertainment: ['中央社─娛樂']
        };

        // 預設黑名單過濾字詞
        const defaultBlockKeywords = ['八卦', '緋聞', '爆料', '私生活', '車禍', '火災', '殺人', '搶劫', '偷竊', '同居', '直擊', '戀情', '離婚'];

        // 從 LocalStorage 載入使用者變更，若無則使用預設
        let currentSources = JSON.parse(localStorage.getItem('nd_sources')) || defaultSources;
        let currentBlockKeywords = JSON.parse(localStorage.getItem('nd_keywords')) || defaultBlockKeywords;
        let bookmarks = JSON.parse(localStorage.getItem('nd_bookmarks')) || [];
        let notes = JSON.parse(localStorage.getItem('nd_notes')) || {}; // 格式: { articleId: "筆記內容" }

        let activeCategory = 'politics';

        // ==========================================
        // 2. 智慧型動態新聞模擬引擎 (符合2026時空、24小時內、精準對應分類規則)
        // ==========================================
        function generate24HMockNews() {
            const list = [];
            const intlBrands = ['BBC News', 'ABC News', '路透社', '紐約時報', '日經新聞網', 'NHK', '德國之聲', '朝日新聞網'];
            let idCounter = 1;

            const now = new Date(); // 2026-05-28

            // 為 9 個分類各自生成大量素材庫，以供過濾並確保各自留下精準的 8 則
            Object.keys(categoryMap).forEach(cat => {
                const allowedSrcs = currentSources[cat] || [];
                
                for(let i = 0; i < 20; i++) {
                    // 隨機分配是本地媒體還是國際外媒
                    const isIntlBrand = Math.random() > 0.6;
                    const src = isIntlBrand ? intlBrands[Math.floor(Math.random() * intlBrands.length)] : (allowedSrcs[Math.floor(Math.random() * allowedSrcs.length)] || '獨立綜合報導');
                    
                    // 隨機在 24 小時內的時間
                    const randHoursAgo = Math.random() * 23;
                    const pubTime = new Date(now.getTime() - randHoursAgo * 60 * 60 * 1000).toISOString();

                    let title = "", desc = "";

                    // 依分類建立「符合過濾條件」與「故意夾雜會被濾除」的對比資料
                    if (cat === 'politics') {
                        if (i % 4 === 0) { title = `驚爆！政壇大老與大牌明星深夜出入招待所遭直擊`; desc = `有民眾爆料指出，多位政治人物涉嫌參與私人豪奢派對，現場緋聞八卦甚囂塵上...`; }
                        else { title = `立法院三讀通過重大《能源轉型稅收條例》落實綠能減碳政策`; desc = `此項全新政策法案歷經三輪激烈辯論，旨在推動大型企業碳稅全面與國際市場對接。`; }
                    } else if (cat === 'international') {
                        if (i % 4 === 0) { title = `好萊塢巨星驚傳街頭與人大打出手 遭警方依傷害罪逮捕`; desc = `這起突發的社會案件震驚娛樂圈，八卦媒體爭相報導其私生活失控原因。`; }
                        else { title = `聯合國安全理事會針對地緣經濟簽署最新防禦戰略協議`; desc = `各國首長今日在峰會發表共同聲明，將針對關鍵供應鏈安全實施多邊合作保護。`; }
                    } else if (cat === 'economy') {
                        title = `晶圓代工大廠宣布加碼投資！擴建 2 奈米次世代先進製程晶圓廠`;
                        desc = `產經高層分析指出，由於全球高效能運算市場需求強勁，此次投資有助於穩固供應鏈龍頭地位。`;
                    } else if (cat === 'tech') {
                        title = `全新開源大型語言模型發表 運算效能突破現行架構瓶頸`;
                        desc = `數位科技研發團隊展示了最新微調技術，能使模型在行動裝置上的推論速度提升一倍。`;
                    } else if (cat === 'life') {
                        title = `氣象署發布高溫特報！夏季熱浪提早報到 全台紫外線指數達危險級`;
                        desc = `提醒民衆生活作息調整，多補充水分。各大餐飲業者也順勢推出消暑新品搶攻夏日商機。`;
                    } else if (cat === 'culture') {
                        title = `當代美術館年度大展明登場：揉合數位虛擬與傳統工藝的視覺盛宴`;
                        desc = `文化藝術界高度關注，本次特展邀請多位新生代藝術家共同創作，探討跨世代語境。`;
                    } else if (cat === 'local') {
                        if (i % 3 === 0) { title = `市區十字路口凌晨驚傳三車連環追撞重大車禍 釀2死3傷悲劇`; desc = `警方初步調查懷疑是酒駕超速導致，現場全武行散落一地，社會案件調查中。`; }
                        else { title = `環狀軌道交通二期建設正式動工 動態文資觀光廊帶初具規模`; desc = `地方政府表示，新一輪開發著重歷史文化資產活化與低碳旅遊，將全面帶動區域周邊經濟。`; }
                    } else if (cat === 'sports') {
                        if (i % 3 === 0) { title = `某球星遭週刊爆料婚內出軌 形象重挫恐面臨百萬球隊罰款`; desc = `八卦體育版面頭條，球迷痛批私生活不檢點，經紀公司緊急發表聲明致歉。`; }
                        else { title = `世界棒球經典賽熱烈開打！國家隊展現超強韌性 逆轉擊敗強敵`; desc = `這場高張力的國際賽事吸引萬人進場應援，賽後針對戰術調度與運動議題引發社群熱烈討論。`; }
                    } else if (cat === 'entertainment') {
                        if (i % 3 === 0) { title = `驚傳離婚！金獎怨偶發聲明證實結束五年婚姻 財產分配引發八卦`; desc = `娛樂爆料頭條直擊，兩人昔日甜蜜同居畫面不再，粉絲不勝唏噓。`; }
                        else { title = `【深度影評】年度史詩科幻新作：精準解構科技與人性的極致視覺敘事`; desc = `本片擺脫庸俗的娛樂八卦套路，以嚴謹的編劇架構與美術特效，榮登本季最值得探討的娛樂佳作。`; }
                    }

                    list.push({
                        id: `art-${idCounter++}`,
                        title: title,
                        description: desc,
                        source: src,
                        publishedAt: pubTime,
                        urlToImage: `https://picsum.photos/id/${(idCounter * 7) % 100}/400/250`,
                        url: "#",
                        injectedCategory: cat // 用於外媒自動分類的錨定提示
                    });
                }
            });
            return list;
        }

        // ==========================================
        // 3. 系統核心過濾器與自動分類機 (核心邏輯)
        // ==========================================
        function processAndGetNews(category) {
            const rawNews = generate24HMockNews();
            const allowedForCat = currentSources[category] || [];
            const result = [];

            for (let article of rawNews) {
                // A. 檢查是否符合 24 小時內限制 (模擬引擎已保證在24小時內，此處做雙重安全閥)
                const hoursAgo = (new Date() - new Date(article.publishedAt)) / (1000 * 60 * 60);
                if (hoursAgo > 24) continue;

                // B. 檢查全域與特定黑名單過濾關鍵字 (避開八卦、社會案件等)
                const textToScan = (article.title + article.description).toLowerCase();
                const hasBlockWord = currentBlockKeywords.some(kw => textToScan.includes(kw.toLowerCase()));
                if (hasBlockWord) continue; // 抓到八卦或不符標準的內容 -> 直接踢除！

                // C. 判定新聞來源歸屬
                let isMatch = false;

                // 如果是指定本地新聞源
                if (allowedForCat.includes(article.source)) {
                    isMatch = true;
                } 
                // 如果是「其他國際新聞」外媒 -> 根據內容特性動態自動歸類到適合的位置
                else {
                    const intlBrands = ['bbc news', 'abc news', '路透社', '紐約時報', '日經新聞網', 'nhk', '德國之聲', '朝日新聞網'];
                    const isIntlMedia = intlBrands.some(brand => article.source.toLowerCase().includes(brand));
                    
                    if (isIntlMedia && article.injectedCategory === category) {
                        isMatch = true;
                    }
                }

                if (isMatch) {
                    result.push(article);
                }

                // 每個分類嚴格鎖定只抓取前 8 則
                if (result.length === 8) break;
            }

            // 防呆：萬一過濾太嚴苛不滿8則，自動補足乾淨的保證標準資料
            while(result.length < 8) {
                result.push({
                    id: `art-fallback-${Math.random()}`,
                    title: `【${categoryMap[category].name}專題】高效能重大發展與核心議題追蹤報導`,
                    description: `本報導鎖定高價值產業政策、重大事件與學術對話，避開一切花邊八卦，提供深度實用的核心觀點解析。`,
                    source: allowedForCat[0] || '權威綜合觀點',
                    publishedAt: new Date().toISOString(),
                    urlToImage: `https://picsum.photos/id/${Math.floor(Math.random()*50)}/400/250`,
                    url: "#"
                });
            }

            return result;
        }

        // 英文簡易關鍵字自動提取 (3-5個)
        function extractKeywordsAuto(title, desc) {
            const combined = `${title} ${desc || ''}`.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'’]/g, " ");
            const tokens = combined.split(/\s+/);
            const stopWords = ['the','and','via','for','with','this','that','from'];
            const keeps = tokens.filter(t => t.length > 3 && !stopWords.includes(t.toLowerCase())).map(t => t.toLowerCase());
            const unique = [...new Set(keeps)];
            
            // 保證提取出3-5個標籤
            let tags = unique.slice(0, Math.floor(Math.random() * 3) + 3);
            if (tags.length < 3) {
                tags = ['焦點', categoryMap[activeCategory].name, '重點追蹤'];
            }
            return tags;
        }

        // ==========================================
        // 4. 前端 UI 渲染邏輯
        // ==========================================
        
        // 切換主分頁
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`page-${pageId}`).classList.add('active');
            event.target.classList.add('active');

            const catBar = document.getElementById('category-bar-zone');
            if (pageId === 'browse') {
                catBar.style.display = 'block';
                renderBrowseNews();
            } else {
                catBar.style.display = 'none';
                if (pageId === 'favorites') renderFavoritesNews();
                if (pageId === 'management') renderManagementPanel();
            }
        }

        // 初始化分類按鈕
        function initCategoryButtons() {
            const container = document.getElementById('category-buttons-container');
            container.innerHTML = '';
            Object.keys(categoryMap).forEach(key => {
                const activeClass = key === activeCategory ? 'active' : '';
                container.innerHTML += `
                    <button class="cat-btn ${activeClass}" onclick="changeCategory('${key}')">
                        ${categoryMap[key].icon} ${categoryMap[key].name}
                    </button>
                `;
            });
        }

        function changeCategory(catKey) {
            activeCategory = catKey;
            initCategoryButtons();
            renderBrowseNews();
        }

        // 渲染瀏覽頁面新聞
        function renderBrowseNews() {
            const titleZone = document.getElementById('current-category-title');
            const grid = document.getElementById('browse-news-grid');
            
            titleZone.innerHTML = `${categoryMap[activeCategory].icon} ${categoryMap[activeCategory].name}最新報導 (嚴選 24H 內共 8 則)`;
            grid.innerHTML = '';

            const articles = processAndGetNews(activeCategory);

            articles.forEach(art => {
                const isBookmarked = bookmarks.some(b => b.id === art.id);
                const favClass = isBookmarked ? 'bookmarked' : '';
                const favText = isBookmarked ? '❤️ 已收藏' : '⭐ 收藏新聞';
                
                const kws = extractKeywordsAuto(art.title, art.description);
                const kwsHTML = kws.map(k => `<span class="keyword-tag">#${k}</span>`).join('');
                
                const timeStr = new Date(art.publishedAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

                grid.innerHTML += `
                    <article class="news-card">
                        <img class="news-img" src="${art.urlToImage}" alt="img">
                        <div class="news-content">
                            <div class="news-source">
                                <span>📍 ${art.source}</span>
                                <span class="news-time">${timeStr}</span>
                            </div>
                            <h3 class="news-title">${art.title}</h3>
                            <p class="news-desc">${art.description}</p>
                            <div class="kw-container">${kwsHTML}</div>
                            <div class="card-footer">
                                <a href="${art.url}" class="btn-action btn-read">閱讀原文</a>
                                <button class="btn-action btn-fav ${favClass}" onclick="toggleBookmark(${JSON.stringify(art).replace(/"/g, '&quot;')})">${favText}</button>
                            </div>
                        </div>
                    </article>
                `;
            });
        }

        // 收藏功能切換
        function toggleBookmark(art) {
            const idx = bookmarks.findIndex(b => b.id === art.id);
            if (idx > -1) {
                bookmarks.splice(idx, 1);
                delete notes[art.id];
            } else {
                bookmarks.push(art);
            }
            localStorage.setItem('nd_bookmarks', JSON.stringify(bookmarks));
            localStorage.setItem('nd_notes', JSON.stringify(notes));
            updateFavCount();
            
            if (document.getElementById('page-browse').classList.contains('active')) {
                renderBrowseNews();
            } else {
                renderFavoritesNews();
            }
        }

        function updateFavCount() {
            document.getElementById('fav-count').innerText = bookmarks.length;
        }

        // 渲染收藏夾與個人筆記
        function renderFavoritesNews() {
            const grid = document.getElementById('favorites-news-grid');
            grid.innerHTML = '';

            if (bookmarks.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:5px 0; color:var(--text-muted);">📭 收藏夾空空如也，快去新聞瀏覽頁面加點好文吧！</div>`;
                return;
            }

            bookmarks.forEach(art => {
                const currentNote = notes[art.id] || '';
                const kws = extractKeywordsAuto(art.title, art.description);
                const kwsHTML = kws.map(k => `<span class="keyword-tag">#${k}</span>`).join('');

                grid.innerHTML += `
                    <article class="news-card">
                        <img class="news-img" src="${art.urlToImage}" alt="img">
                        <div class="news-content">
                            <div class="news-source"><span>📍 ${art.source}</span></div>
                            <h3 class="news-title">${art.title}</h3>
                            <p class="news-desc">${art.description}</p>
                            <div class="kw-container">${kwsHTML}</div>
                            
                            <div class="note-area">
                                <textarea class="note-input" placeholder="💡 在這裡寫下這篇新聞的讀後筆記或心得..." id="note-${art.id}" oninput="saveNote('${art.id}')">${currentNote}</textarea>
                            </div>

                            <div class="card-footer">
                                <button class="btn-action btn-fav bookmarked" onclick='toggleBookmark(${JSON.stringify(art).replace(/"/g, '&quot;')})'>🗑️ 移除收藏</button>
                            </div>
                        </div>
                    </article>
                `;
            });
        }

        // 保存筆記內容
        function saveNote(artId) {
            const text = document.getElementById(`note-${artId}`).value;
            notes[artId] = text;
            localStorage.setItem('nd_notes', JSON.stringify(notes));
        }

        // ==========================================
        // 5. 後台控制面板邏輯 (直接新增/管理新聞源與關鍵字)
        // ==========================================
        function renderManagementPanel() {
            // 填充選擇分類下拉選單
            const sel = document.getElementById('mgmt-src-cat');
            sel.innerHTML = '';
            Object.keys(categoryMap).forEach(k => {
                sel.innerHTML += `<option value="${k}">${categoryMap[k].name}</option>`;
            });

            renderMgmtSources();
            renderMgmtKeywords();
        }

        function renderMgmtSources() {
            const container = document.getElementById('mgmt-sources-list');
            container.innerHTML = '';
            
            Object.keys(currentSources).forEach(cat => {
                currentSources[cat].forEach((src, idx) => {
                    container.innerHTML += `
                        <div class="item-tag">
                            <span>[${categoryMap[cat].name}] ${src}</span>
                            <button class="btn-del" onclick="deleteSourceViaMgmt('${cat}', ${idx})">×</button>
                        </div>
                    `;
                });
            });
        }

        function addSourceViaMgmt() {
            const cat = document.getElementById('mgmt-src-cat').value;
            const name = document.getElementById('mgmt-src-name').value.trim();
            if(!name) return alert('請輸入新聞源名稱');
            
            if(!currentSources[cat]) currentSources[cat] = [];
            currentSources[cat].push(name);
            localStorage.setItem('nd_sources', JSON.stringify(currentSources));
            document.getElementById('mgmt-src-name').value = '';
            renderMgmtSources();
        }

        function deleteSourceViaMgmt(cat, idx) {
            currentSources[cat].splice(idx, 1);
            localStorage.setItem('nd_sources', JSON.stringify(currentSources));
            renderMgmtSources();
        }

        function renderMgmtKeywords() {
            const container = document.getElementById('mgmt-keywords-list');
            container.innerHTML = '';
            currentBlockKeywords.forEach((kw, idx) => {
                container.innerHTML += `
                    <div class="item-tag">
                        <span>${kw}</span>
                        <button class="btn-del" onclick="deleteKeywordViaMgmt(${idx})">×</button>
                    </div>
                `;
            });
        }

        function addKeywordViaMgmt() {
            const text = document.getElementById('mgmt-kw-text').value.trim();
            if(!text) return alert('請輸入過濾字詞');
            currentBlockKeywords.push(text);
            localStorage.setItem('nd_keywords', JSON.stringify(currentBlockKeywords));
            document.getElementById('mgmt-kw-text').value = '';
            renderMgmtKeywords();
        }

        function deleteKeywordViaMgmt(idx) {
            currentBlockKeywords.splice(idx, 1);
            localStorage.setItem('nd_keywords', JSON.stringify(currentBlockKeywords));
            renderMgmtKeywords();
        }

        // ==========================================
        // 6. 系統初始化啟動
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            initCategoryButtons();
            updateFavCount();
            renderBrowseNews();
        });
    </script>
</body>
</html>
