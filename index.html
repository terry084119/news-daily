<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新聞智庫 | 採訪記者專業版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --paper: #ffffff; --sidebar: #f8f9fa; --accent: #d32f2f; --ink: #212121; }
        body { margin: 0; font-family: 'Noto Sans TC', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* 側邊導覽 */
        .sidebar { width: 200px; background: var(--sidebar); border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 2px solid #333; font-weight: bold; }
        .nav-items { flex: 1; overflow-y: auto; }
        .nav-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid #eee; transition: 0.2s; }
        .nav-item:hover { background: #e9ecef; }
        .nav-item.active { background: #333; color: white; }

        /* 主內容列表 */
        .main { flex: 1; overflow-y: auto; padding: 20px 40px; }
        .news-card { padding: 20px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .news-content { flex: 1; padding-right: 20px; }
        .news-title { font-size: 1.15rem; font-weight: bold; color: var(--ink); text-decoration: none; display: block; margin-bottom: 5px; }
        .news-title:hover { color: var(--accent); }
        .news-meta { font-size: 0.8rem; color: #888; margin-bottom: 8px; }
        
        /* 關鍵字標籤 */
        .kw-tag { font-size: 0.75rem; background: #f0f0f0; color: #666; padding: 2px 8px; border-radius: 12px; margin-right: 5px; border: 1px solid #ddd; }

        /* 預覽面板 */
        #preview-pane { width: 0; background: white; border-left: 0; display: flex; flex-direction: column; position: relative; transition: width 0.1s; }
        #preview-pane.open { width: 45%; border-left: 2px solid #333; }
        .resizer { width: 6px; cursor: col-resize; position: absolute; left: -3px; top: 0; bottom: 0; z-index: 10; }
        .pane-header { padding: 10px; background: #eee; display: flex; justify-content: space-between; }
        iframe { flex: 1; border: none; }
        .note-area { height: 140px; padding: 10px; background: #fffde7; border-top: 1px solid #ddd; }
        textarea { width: 100%; height: 70px; resize: none; border: 1px solid #ccc; }

        /* 管理彈窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
        .modal-content { background: white; width: 450px; margin: 100px auto; padding: 20px; border-radius: 8px; }
        .tag-btn { display: inline-block; background: #eee; padding: 5px 10px; border-radius: 15px; margin: 3px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">新聞智庫</div>
    <div class="nav-items" id="nav-list"></div>
    <div style="padding:15px;"><button style="width:100%" onclick="setModal(true)">⚙️ 設定關鍵字</button></div>
</div>

<div class="main">
    <h2 id="cat-title">選擇類別</h2>
    <div id="news-list"></div>
</div>

<div id="preview-pane">
    <div class="resizer" id="resizer"></div>
    <div class="pane-header">
        <button onclick="toggleP(false)">✕ 關閉</button>
        <button onclick="window.open(activeU)">🌐 新分頁開啟</button>
    </div>
    <iframe id="ifr"></iframe>
    <div class="note-area">
        <div style="font-weight:bold; font-size:0.8rem;">採訪筆記</div>
        <textarea id="note-in" oninput="saveN()"></textarea>
    </div>
</div>

<div class="modal" id="m">
    <div class="modal-content">
        <h3>管理追蹤關鍵字</h3>
        <div id="kw-list"></div>
        <input type="text" id="kw-in" placeholder="輸入關鍵字按 Enter" style="width:100%; padding:8px; margin-top:10px;">
        <p style="font-size:0.7rem; color:gray;">這些字詞將用於標記與過濾新聞列表。</p>
        <button onclick="setModal(false)">完成</button>
    </div>
</div>

<script>
    let data = {};
    let activeU = "";
    let pref = JSON.parse(localStorage.getItem('pref') || '{"likes":[], "dislikes":[], "kws":[]}');
    let notes = JSON.parse(localStorage.getItem('notes') || '{}');

    async function init() {
        const r = await fetch('news_data.json?t=' + Date.now());
        data = await r.json();
        renderNav();
        render('政治');
    }

    function renderNav() {
        const nav = document.getElementById('nav-list');
        const cats = [...Object.keys(data), "❤️ 收藏"];
        nav.innerHTML = cats.map(c => `<div class="nav-item" onclick="render('${c}')">${c}</div>`).join('');
    }

    function render(c) {
        document.getElementById('cat-title').innerText = c;
        const list = document.getElementById('news-list');
        let items = (c === "❤️ 收藏") ? Object.values(data).flat().filter(n => pref.likes.includes(n.link)) : (data[c] || []);
        
        list.innerHTML = items.map(n => {
            if (pref.dislikes.includes(n.link)) return '';
            const matched = pref.kws.filter(k => n.title.includes(k));
            return `
                <div class="news-card">
                    <div class="news-content">
                        <div class="news-meta">${n.source} · ${n.time}</div>
                        <a href="${n.link}" target="_blank" class="news-title">${n.title}</a>
                        <div style="font-size:0.9rem; color:#666;">${n.summary}</div>
                        <div style="margin-top:8px;">${matched.map(k => `<span class="kw-tag">#${k}</span>`).join('')}</div>
                    </div>
                    <div style="display:flex; gap:5px; align-items:center;">
                        <button onclick="handle('like','${n.link}')">${pref.likes.includes(n.link)?'❤️':'🤍'}</button>
                        <button onclick="handle('dis','${n.link}')">👎</button>
                        <button onclick="openP('${n.link}')">👁️</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function handle(type, u) {
        if(type==='like') {
            if(pref.likes.includes(u)) pref.likes = pref.likes.filter(x=>x!==u);
            else pref.likes.push(u);
        } else pref.dislikes.push(u);
        localStorage.setItem('pref', JSON.stringify(pref));
        render(document.getElementById('cat-title').innerText);
    }

    function openP(u) {
        activeU = u;
        document.getElementById('preview-pane').classList.add('open');
        document.getElementById('ifr').src = u;
        document.getElementById('note-in').value = notes[u] || "";
    }

    function toggleP(s) { if(!s) document.getElementById('preview-pane').classList.remove('open'); }
    
    function saveN() {
        notes[activeU] = document.getElementById('note-in').value;
        localStorage.setItem('notes', JSON.stringify(notes));
    }

    function setModal(s) {
        document.getElementById('m').style.display = s ? 'block' : 'none';
        if(s) {
            document.getElementById('kw-list').innerHTML = pref.kws.map((k,i)=>`
                <span class="tag-btn">${k} <span style="cursor:pointer;color:red" onclick="remKw(${i})">×</span></span>
            `).join('');
        }
    }

    document.getElementById('kw-in').onkeypress = function(e) {
        if(e.key==='Enter' && this.value) {
            pref.kws.push(this.value);
            this.value='';
            localStorage.setItem('pref', JSON.stringify(pref));
            setModal(true);
            render(document.getElementById('cat-title').innerText);
        }
    }

    function remKw(i) {
        pref.kws.splice(i,1);
        localStorage.setItem('pref', JSON.stringify(pref));
        setModal(true);
        render(document.getElementById('cat-title').innerText);
    }

    // 拖曳縮放
    const resizer = document.getElementById('resizer');
    const pane = document.getElementById('preview-pane');
    resizer.addEventListener('mousedown', (e) => {
        document.addEventListener('mousemove', resize);
        document.addEventListener('mouseup', () => document.removeEventListener('mousemove', resize));
    });
    function resize(e) {
        const w = window.innerWidth - e.clientX;
        if(w > 300 && w < 900) pane.style.width = w + 'px';
    }

    init();
</script>
</body>
</html>
