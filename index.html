<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Daily Pro - 即時新聞</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #161925;
            --bg-input: #1f2336;
            --text-main: #f0f2f5;
            --text-muted: #9aa0b6;
            --accent: #7c4dff;
            --accent-hover: #651fff;
            --success: #00e676;
            --danger: #ff1744;
            --border: #262b42;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 60px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* 導覽列 */
        header { background-color: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .nav-main { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        .logo { font-size: 22px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent); }
        .nav-tabs { display: flex; gap: 10px; }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 8px 16px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; background-color: var(--bg-input); }
        .tab-btn.active { color: #fff; background-color: var(--accent); }

        /* 分類列 */
        .category-bar { background-color: #121420; border-bottom: 1px solid var(--border); padding: 12px 0; overflow-x: auto; white-space: nowrap; }
        .category-wrapper { display: flex; gap: 8px; }
        .cat-btn { background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .cat-btn:hover, .cat-btn.active { border-color: var(--accent); color: #fff; background-color: var(--bg-input); }

        /* 區塊開關 */
        .page-section { display: none; padding: 25px 0; }
        .page-section.active { display: block; }

        /* 讀取狀態 */
        .loading-zone { text-align: center; padding: 50px 0; font-size: 16px; color: var(--accent); display: none; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); width: 28px; height: 28px; border-radius: 50%; border-left-color: var(--accent); animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 純文字高密度新聞卡片 */
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .news-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; transition: border-color 0.2s; }
        .news-card:hover { border-color: var(--accent); }
        .news-source { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .news-time { color: var(--text-muted); font-weight: normal; }
        .news-title { font-size: 17px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; color: #fff; text-decoration: none; display: block; }
        .news-title:hover { color: var(--accent-hover); }
        .news-desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 15px; flex-grow: 1; }
        
        .kw-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .kw-tag { background-color: var(--bg-input); color: var(--text-main); font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); }
        
        .card-footer { display: flex; gap: 10px; margin-top: auto; }
        .btn-action { flex: 1; text-align: center; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-read { background-color: var(--bg-input); color: #fff; border: 1px solid var(--border); }
        .btn-read:hover { background-color: var(--border); }
        .btn-fav { background-color: rgba(124, 77, 255, 0.1); color: var(--accent); }
        .btn-fav:hover { background-color: var(--accent); color: #fff; }
        .btn-fav.bookmarked { background-color: var(--danger); color: #fff; }

        /* 隨手筆記 */
        .note-area { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
        .note-input { width: 100%; background-color: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; resize: vertical; margin-bottom: 6px; }

        /* 後台控制 */
        .mgmt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .mgmt-grid { grid-template-columns: 1fr; } }
        .panel { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .panel h3 { margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .mgmt-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .mgmt-input-row { display: flex; gap: 8px; }
        .mgmt-input { background-color: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 6px; flex: 1; }
        .mgmt-select { background-color: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; }
        .btn-add { background-color: var(--success); color: #000; font-weight: 700; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; }
        
        .item-list { display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto; }
        .item-tag { background-color: var(--bg-input); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .btn-del { background: none; border: none; color: var(--danger); font-weight: 700; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="container nav-main">
            <div class="logo">📰 NewsDaily<span>Pro</span></div>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchPage('browse')">新聞瀏覽</button>
                <button class="tab-btn" onclick="switchPage('favorites')">收藏夾 (<span id="fav-count">0</span>)</button>
                <button class="tab-btn" onclick="switchPage('management')">後台設定</button>
            </div>
        </div>
    </header>

    <div class="category-bar" id="category-bar-zone">
        <div class="container category-wrapper" id="category-buttons-container"></div>
    </div>

    <main class="container">
        <div class="loading-zone" id="system-loading">
            <div class="spinner"></div>
            <p>正在動態同步請求各媒體 RSS 饋送源中...</p>
        </div>

        <section id="page-browse" class="page-section active">
            <h2 id="current-category-title" style="margin-bottom: 20px; font-size: 22px;"></h2>
            <div class="news-grid" id="browse-news-grid"></div>
        </section>

        <section id="page-favorites" class="page-section">
            <h2 style="margin-bottom: 20px; font-size: 22px;">📁 收藏的新聞與隨手筆記</h2>
            <div class="news-grid" id="favorites-news-grid"></div>
        </section>

        <section id="page-management" class="page-section">
            <h2 style="margin-bottom: 25px; font-size: 22px;">⚙️ 前台直接控制中心</h2>
            <div class="mgmt-grid">
                
                <div class="panel">
                    <h3>📰 訂閱與調整各分類 RSS 來源</h3>
                    <div class="mgmt-form">
                        <div class="mgmt-input-row">
                            <select id="mgmt-src-cat" class="mgmt-select"></select>
                            <input type="text" id="mgmt-src-name" class="mgmt-input" placeholder="媒體名稱 (如: 中央社─政治)">
                        </div>
                        <div class="mgmt-input-row">
                            <input type="text" id="mgmt-src-url" class="mgmt-input" placeholder="真實 RSS 網址 (XML 連結)">
                            <button class="btn-add" onclick="addSourceViaMgmt()">新增</button>
                        </div>
                    </div>
                    <button class="btn-action btn-read" style="margin-bottom:15px; width:100%;" onclick="resetToDefaultSources()">⚡ 還原成系統預設台灣媒體源</button>
                    <div class="item-list" id="mgmt-sources-list"></div>
                </div>

                <div class="panel">
                    <h3>🚫 敏感詞與八卦自動阻斷器</h3>
                    <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">只要標題或摘要包含以下字眼，會自動過濾。若放寬條件可將其刪除。</p>
                    <div class="mgmt-form">
                        <div class="mgmt-input-row">
                            <input type="text" id="mgmt-kw-text" class="mgmt-input" placeholder="輸入要阻斷的敏感詞">
                            <button class="btn-add" onclick="addKeywordViaMgmt()">加入</button>
                        </div>
                    </div>
                    <div class="item-list" id="mgmt-keywords-list"></div>
                </div>

            </div>
        </section>
    </main>

    <script>
        // ==========================================
        // 1. 真實全台灣各大媒體 RSS 預設資料庫
        // ==========================================
        const categoryMap = {
            politics: { name: '政治', icon: '⚖️' },
            international: { name: '國際', icon: '🌐' },
            economy: { name: '產經', icon: '📊' },
            tech: { name: '科技', icon: '🚀' },
            life: { name: '生活', icon: '🍕' },
            culture: { name: '文化', icon: '🎨' },
            local: { name: '地方', icon: '🗺️' },
            sports: { name: '運動', icon: '⚾' },
            entertainment: { name: '娛樂', icon: '🎬' }
        };

        const defaultSources = {
            politics: [
                { name: '中央社─政治', url: 'https://www.cna.com.tw/cna2018/ws/Rss.aspx?id=aIPL' },
                { name: '報導者─政治社會', url: 'https://www.twreporter.org/a/rss.xml' }
            ],
            international: [
                { name: '中央社─國際', url: 'https://www.cna.com.tw/cna2018/ws/Rss.aspx?id=aINT' },
                { name: '聯合新聞網─全球', url: 'https://udn.com/rssfeed/news/2/7225' },
                { name: 'BBC NEWS中文', url: 'https://feeds.bbci.co.uk/zhongwen/trad/rss.xml' }
            ],
            economy: [
                { name: '經濟日報─產業', url: 'https://money.udn.com/rssfeed/news/1001/2047' },
                { name: '中央社─產經', url: 'https://www.cna.com.tw/cna2018/ws/Rss.aspx?id=aIECO' }
            ],
            tech: [
                { name: '中央社─科技', url: 'https://www.cna.com.tw/cna2018/ws/Rss.aspx?id=aITEC' },
                { name: '數位時代', url: 'https://www.bnext.com.tw/rss' }
            ],
            life: [
                { name: '中央社─生活', url: 'https://www.cna.com.tw/cna2018/ws/Rss.aspx?id=aHEL' }
            ],
            culture: [
                { name: '中央社─文化', url: 'https://www.cna.com.tw/cna2018/ws/Rss.aspx?id=aCUL' },
                { name: '聯合新聞網─文教', url: 'https://udn.com/rssfeed/news/2/6885' }
            ],
            local: [
                { name: '中央社─地方', url: 'https://www.cna.com.tw/cna2018/ws/Rss.aspx?id=aLOC' },
                { name: '聯合新聞網─地方', url: 'https://udn.com/rssfeed/news/2/6641' }
            ],
            sports: [
                { name: '中央社─運動', url: 'https://www.cna.com.tw/cna2018/ws/Rss.aspx?id=aSPO' }
            ],
            entertainment: [
                { name: '中央社─娛樂', url: 'https://www.cna.com.tw/cna2018/ws/Rss.aspx?id=aMOV' }
            ]
        };

        // 預設過濾詞（放寬條件：減少敏感詞，避免誤殺正常新聞）
        const defaultBlockKeywords = ['八卦', '爆料', '床戰', '不倫', '小三'];

        let currentSources = JSON.parse(localStorage.getItem('nd_real_sources')) || defaultSources;
        let currentBlockKeywords = JSON.parse(localStorage.getItem('nd_real_keywords')) || defaultBlockKeywords;
        let bookmarks = JSON.parse(localStorage.getItem('nd_real_bookmarks')) || [];
        let notes = JSON.parse(localStorage.getItem('nd_real_notes')) || {};

        let activeCategory = 'politics';

        // ==========================================
        // 2. 高成功率：Raw 純文字 XML 抓取器
        // ==========================================
        async function fetchRssToArticles(sourceObj) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6000); // 延長到 6 秒防止逾時

            try {
                // 改用 /raw 接口直接拿最原始的 XML 純文字，繞過複雜轉檔程序
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(sourceObj.url)}&_ts=${Date.now()}`;
                
                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!response.ok) return [];
                
                const xmlText = await response.text();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const items = xmlDoc.querySelectorAll("item");
                
                let parsedList = [];
                items.forEach(item => {
                    const title = item.querySelector("title")?.textContent || "";
                    let description = item.querySelector("description")?.textContent || "";
                    const link = item.querySelector("link")?.textContent || "#";
                    const pubDate = item.querySelector("pubDate")?.textContent || "";
                    
                    // 潔淨化描述欄位的 HTML 標籤
                    description = description.replace(/<\/?[^>]+(>|$)/g, "").trim();

                    // 格式化時間顯示
                    let displayTime = "";
                    if (pubDate) {
                        try {
                            const d = new Date(pubDate);
                            displayTime = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                        } catch(e) { displayTime = pubDate.substring(0, 16); }
                    }

                    if (title) {
                        parsedList.push({
                            title: title,
                            description: description.substring(0, 120) + (description.length > 120 ? "..." : ""),
                            url: link,
                            time: displayTime,
                            source: sourceObj.name
                        });
                    }
                });
                return parsedList;
            } catch (err) {
                clearTimeout(timeoutId);
                console.warn(`無法讀取來源: ${sourceObj.name}`);
                return [];
            }
        }

        // ==========================================
        // 3. 【條件放寬】平行抓取與黑名單過濾
        // ==========================================
        async function loadAndProcessCategoryNews(category) {
            document.getElementById('system-loading').style.display = 'block';
            document.getElementById('browse-news-grid').innerHTML = '';

            const localSources = currentSources[category] || [];
            const allTasks = localSources.map(src => fetchRssToArticles(src));

            // 多管齊下同時抓取
            const resultsArray = await Promise.all(allTasks);
            let allArticles = resultsArray.flat();

            const finalArticles = [];

            for (let art of allArticles) {
                // 1. 簡易黑名單字詞過濾
                const fullText = (art.title + art.description).toLowerCase();
                const isSpam = currentBlockKeywords.some(kw => kw && fullText.includes(kw.toLowerCase()));
                if (isSpam) continue;

                // 2. 防止重覆標題
                if (finalArticles.some(a => a.title === art.title)) continue;

                finalArticles.push(art);
                if (finalArticles.length === 15) break; // 上限放寬到 15 則
            }

            document.getElementById('system-loading').style.display = 'none';
            return finalArticles;
        }

        // 自動關鍵字標籤
        function extractKeywordsAuto(title, desc) {
            const cleanText = `${title} ${desc || ''}`.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'’]/g, " ");
            const words = cleanText.split(/[\s,、，。]/).filter(w => w.length > 1);
            const stopWords = ['今天', '民眾', '指出', '報導', '目前', '表示', '進行', '已經', '核心', '一個', '可以'];
            const filtered = words.filter(w => !stopWords.includes(w));
            
            let unique = [...new Set(filtered)];
            let tags = unique.slice(0, 3);
            if (tags.length < 2) tags = [categoryMap[activeCategory].name, '即時焦點'];
            return tags.map(k => `#${k}`);
        }

        // ==========================================
        // 4. 前端 UI 控制與渲染
        // ==========================================
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`page-${pageId}`).classList.add('active');
            event.target.classList.add('active');

            const catBar = document.getElementById('category-bar-zone');
            if (pageId === 'browse') {
                catBar.style.display = 'block';
                renderBrowseNews();
            } else {
                catBar.style.display = 'none';
                if (pageId === 'favorites') renderFavoritesNews();
                if (pageId === 'management') renderManagementPanel();
            }
        }

        function initCategoryButtons() {
            const container = document.getElementById('category-buttons-container');
            container.innerHTML = '';
            Object.keys(categoryMap).forEach(key => {
                const activeClass = key === activeCategory ? 'active' : '';
                container.innerHTML += `
                    <button class="cat-btn ${activeClass}" onclick="changeCategory('${key}')">
                        ${categoryMap[key].icon} ${categoryMap[key].name}
                    </button>
                `;
            });
        }

        function changeCategory(catKey) {
            activeCategory = catKey;
            initCategoryButtons();
            renderBrowseNews();
        }

        async function renderBrowseNews() {
            const titleZone = document.getElementById('current-category-title');
            const grid = document.getElementById('browse-news-grid');
            
            titleZone.innerHTML = `${categoryMap[activeCategory].icon} ${categoryMap[activeCategory].name} 即時新聞流`;
            grid.innerHTML = '';

            const articles = await loadAndProcessCategoryNews(activeCategory);

            if(articles.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px;">📭 目前此分類各來源暫無即時資料，可至後台檢查或更換 RSS 連結。</div>`;
                return;
            }

            articles.forEach((art) => {
                const isBookmarked = bookmarks.some(b => b.title === art.title);
                const favClass = isBookmarked ? 'bookmarked' : '';
                const favText = isBookmarked ? '❤️ 已收藏' : '⭐ 收藏新聞';
                
                const kws = extractKeywordsAuto(art.title, art.description);
                const kwsHTML = kws.map(k => `<span class="kw-tag">${k}</span>`).join('');

                grid.innerHTML += `
                    <article class="news-card">
                        <div class="news-content">
                            <div class="news-source">
                                <span>📍 ${art.source}</span>
                                <span class="news-time">${art.time}</span>
                            </div>
                            <a href="${art.url}" target="_blank" class="news-title">${art.title}</a>
                            <p class="news-desc">${art.description || '點擊閱讀原文查看詳細報導。'}</p>
                            <div class="kw-container">${kwsHTML}</div>
                            <div class="card-footer">
                                <a href="${art.url}" target="_blank" class="btn-action btn-read">閱讀原文</a>
                                <button class="btn-action btn-fav ${favClass}" onclick='toggleBookmark(${JSON.stringify(art).replace(/"/g, '&quot;')})'>${favText}</button>
                            </div>
                        </div>
                    </article>
                `;
            });
        }

        function toggleBookmark(art) {
            const idx = bookmarks.findIndex(b => b.title === art.title);
            if (idx > -1) {
                bookmarks.splice(idx, 1);
                delete notes[art.title];
            } else {
                bookmarks.push(art);
            }
            localStorage.setItem('nd_real_bookmarks', JSON.stringify(bookmarks));
            localStorage.setItem('nd_real_notes', JSON.stringify(notes));
            updateFavCount();
            
            if (document.getElementById('page-browse').classList.contains('active')) {
                renderBrowseNews();
            } else {
                renderFavoritesNews();
            }
        }

        function updateFavCount() {
            document.getElementById('fav-count').innerText = bookmarks.length;
        }

        function renderFavoritesNews() {
            const grid = document.getElementById('favorites-news-grid');
            grid.innerHTML = '';

            if (bookmarks.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted);">📭 收藏夾目前空空的。</div>`;
                return;
            }

            bookmarks.forEach(art => {
                const currentNote = notes[art.title] || '';
                const kws = extractKeywordsAuto(art.title, art.description);
                const kwsHTML = kws.map(k => `<span class="kw-tag">${k}</span>`).join('');
                const domSafeId = btoa(encodeURIComponent(art.title)).replace(/=/g, '');

                grid.innerHTML += `
                    <article class="news-card">
                        <div class="news-content">
                            <div class="news-source"><span>📍 ${art.source}</span></div>
                            <a href="${art.url}" target="_blank" class="news-title">${art.title}</a>
                            <p class="news-desc">${art.description}</p>
                            <div class="kw-container">${kwsHTML}</div>
                            
                            <div class="note-area">
                                <textarea class="note-input" placeholder="💡 輸入讀後隨手筆記..." id="note-${domSafeId}" oninput="saveNote('${domSafeId}', '${art.title.replace(/'/g, "\\'")}')">${currentNote}</textarea>
                            </div>

                            <div class="card-footer">
                                <button class="btn-action btn-fav bookmarked" onclick='toggleBookmark(${JSON.stringify(art).replace(/"/g, '&quot;')})'>🗑️ 移除收藏</button>
                            </div>
                        </div>
                    </article>
                `;
            });
        }

        function saveNote(elementId, artTitle) {
            notes[artTitle] = document.getElementById(`note-${elementId}`).value;
            localStorage.setItem('nd_real_notes', JSON.stringify(notes));
        }

        // ==========================================
        // 5. 後台設定面板
        // ==========================================
        function renderManagementPanel() {
            const sel = document.getElementById('mgmt-src-cat');
            sel.innerHTML = '';
            Object.keys(categoryMap).forEach(k => {
                sel.innerHTML += `<option value="${k}">${categoryMap[k].name}</option>`;
            });
            renderMgmtSources();
            renderMgmtKeywords();
        }

        function renderMgmtSources() {
            const container = document.getElementById('mgmt-sources-list');
            container.innerHTML = '';
            Object.keys(currentSources).forEach(cat => {
                currentSources[cat].forEach((src, idx) => {
                    container.innerHTML += `
                        <div class="item-tag">
                            <div>
                                <span style="background: var(--accent); padding:2px 6px; border-radius:4px; font-size:11px; margin-right:5px;">${categoryMap[cat].name}</span>
                                <strong>${src.name}</strong> 
                                <br><span style="font-size:11px; color:var(--text-muted); word-break:break-all;">${src.url}</span>
                            </div>
                            <button class="btn-del" onclick="deleteSourceViaMgmt('${cat}', ${idx})">刪除</button>
                        </div>
                    `;
                });
            });
        }

        function addSourceViaMgmt() {
            const cat = document.getElementById('mgmt-src-cat').value;
            const name = document.getElementById('mgmt-src-name').value.trim();
            const url = document.getElementById('mgmt-src-url').value.trim();
            
            if(!name || !url) return alert('請填入完整欄位！');
            if(!url.startsWith('http')) return alert('網址格式必須以 http 開頭');
            
            if(!currentSources[cat]) currentSources[cat] = [];
            currentSources[cat].push({ name, url });
            localStorage.setItem('nd_real_sources', JSON.stringify(currentSources));
            
            document.getElementById('mgmt-src-name').value = '';
            document.getElementById('mgmt-src-url').value = '';
            renderMgmtSources();
        }

        function deleteSourceViaMgmt(cat, idx) {
            currentSources[cat].splice(idx, 1);
            localStorage.setItem('nd_real_sources', JSON.stringify(currentSources));
            renderMgmtSources();
        }

        function resetToDefaultSources() {
            if(confirm('確定要將新聞來源還原回預設值嗎？')) {
                currentSources = JSON.parse(JSON.stringify(defaultSources));
                localStorage.setItem('nd_real_sources', JSON.stringify(currentSources));
                renderMgmtSources();
            }
        }

        function renderMgmtKeywords() {
            const container = document.getElementById('mgmt-keywords-list');
            container.innerHTML = '';
            currentBlockKeywords.forEach((kw, idx) => {
                container.innerHTML += `
                    <div class="item-tag">
                        <span>${kw}</span>
                        <button class="btn-del" onclick="deleteKeywordViaMgmt(${idx})">×</button>
                    </div>
                `;
            });
        }

        function addKeywordViaMgmt() {
            const text = document.getElementById('mgmt-kw-text').value.trim();
            if(!text) return alert('請輸入字詞');
            currentBlockKeywords.push(text);
            localStorage.setItem('nd_real_keywords', JSON.stringify(currentBlockKeywords));
            document.getElementById('mgmt-kw-text').value = '';
            renderMgmtKeywords();
        }

        // 可以動態點擊 × 移除過濾黑名單
        function deleteKeywordViaMgmt(idx) {
            currentBlockKeywords.splice(idx, 1);
            localStorage.setItem('nd_real_keywords', JSON.stringify(currentBlockKeywords));
            renderMgmtKeywords();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCategoryButtons();
            updateFavCount();
            renderBrowseNews();
        });
    </script>
</body>
</html>
