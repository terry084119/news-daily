<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新聞智庫 | 專業版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --paper: #ffffff; --sidebar: #f8f9fa; --accent: #d32f2f; --ink: #212121; }
        body { margin: 0; font-family: 'Noto Sans TC', sans-serif; display: flex; height: 100vh; overflow: hidden; color: var(--ink); }
        
        /* 側邊導覽 */
        .sidebar { width: 220px; background: var(--sidebar); border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 10;}
        .sidebar-header { padding: 20px; border-bottom: 2px solid #333; font-weight: bold; font-size: 1.1rem; }
        .nav-items { flex: 1; overflow-y: auto; }
        .nav-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid #eee; transition: 0.2s; }
        .nav-item:hover { background: #e9ecef; }
        .nav-item.active { background: #333; color: white; font-weight: bold; }

        /* 主內容列表 */
        .main { flex: 1; overflow-y: auto; padding: 20px 40px; background: white; }
        .news-card { padding: 20px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .news-content { flex: 1; padding-right: 20px; }
        .news-title { font-size: 1.15rem; font-weight: bold; color: var(--ink); text-decoration: none; display: block; margin-bottom: 5px; line-height: 1.4; }
        .news-title:hover { color: var(--accent); }
        .news-meta { font-size: 0.8rem; color: #888; margin-bottom: 8px; }
        
        /* 標籤與按鈕 */
        .kw-tag { font-size: 0.75rem; background: #f0f0f0; color: #666; padding: 2px 8px; border-radius: 12px; margin-right: 5px; border: 1px solid #ddd; }
        .btn { border: 1px solid #ccc; background: white; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 0.85rem; transition: 0.2s; }
        .btn:hover { background: #f5f5f5; }
        .btn-red { color: #d32f2f; border-color: #ffcdd2; background: #fff5f5; }
        .btn-blue { color: #1976d2; border-color: #bbdefb; background: #f0f8ff; }

        /* 預覽面板 */
        #preview-pane { width: 0; background: white; border-left: 0; display: flex; flex-direction: column; position: relative; transition: width 0.1s; }
        #preview-pane.open { width: 45%; border-left: 2px solid #333; }
        .resizer { width: 6px; cursor: col-resize; position: absolute; left: -3px; top: 0; bottom: 0; z-index: 10; }
        .pane-header { padding: 10px 15px; background: #f4f4f4; display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; }
        iframe { flex: 1; border: none; }
        .note-area { height: 160px; padding: 15px; background: #fffde7; border-top: 1px solid #ddd; }
        textarea { width: 100%; height: 90px; resize: none; border: 1px solid #ccc; padding: 8px; font-family: inherit; box-sizing: border-box; }

        /* 收藏筆記專用區塊 */
        .fav-note-box { margin-top: 12px; background: #fffde7; padding: 12px; border: 1px solid #e0e0e0; border-radius: 6px; }
        .fav-note-box textarea { width: 100%; height: 80px; border: none; background: transparent; resize: none; outline: none; font-size: 0.9rem; }

        /* 管理彈窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; }
        .modal-content { background: white; width: 550px; margin: 60px auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .tag-btn { display: inline-block; background: #eee; padding: 5px 12px; border-radius: 15px; margin: 4px; font-size: 0.85rem; }
        
        /* 來源過濾按鈕 */
        .source-btn { display: inline-block; padding: 5px 12px; margin: 4px; border-radius: 15px; font-size: 0.85rem; cursor: pointer; border: 1px solid #ccc; background: white; transition: 0.2s; user-select: none; }
        .source-btn.hidden-src { background: #f0f0f0; color: #aaa; text-decoration: line-through; border-color: #eee; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">新聞智庫 PRO</div>
    <div class="nav-items" id="nav-list"></div>
    <div style="padding:15px;"><button class="btn" style="width:100%" onclick="setModal(true)">⚙️ 系統設定</button></div>
</div>

<div class="main">
    <h2 id="cat-title">選擇類別</h2>
    <div id="news-list"></div>
</div>

<div id="preview-pane">
    <div class="resizer" id="resizer"></div>
    <div class="pane-header">
        <button class="btn" onclick="toggleP(false)">✕ 關閉預覽</button>
        <button class="btn btn-blue" onclick="window.open(activeU)">🌐 開啟原文</button>
    </div>
    <iframe id="ifr"></iframe>
    <div class="note-area">
        <div style="font-weight:bold; font-size:0.85rem; margin-bottom: 8px;">📝 採訪 / 研究筆記</div>
        <textarea id="note-in" oninput="saveN()" placeholder="輸入筆記內容，系統將自動存檔..."></textarea>
    </div>
</div>

<div class="modal" id="m">
    <div class="modal-content">
        <h2 style="margin-top:0;">系統設定</h2>
        
        <div style="margin-bottom: 25px;">
            <h4 style="margin-bottom: 8px;">1. 精準鎖定關鍵字</h4>
            <div id="kw-list"></div>
            <input type="text" id="kw-in" placeholder="輸入關鍵字後按 Enter 鍵新增" style="width:100%; padding:10px; margin-top:8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 20px;">
            <h4 style="margin-bottom: 5px;">2. 新聞來源過濾</h4>
            <p style="font-size:0.8rem; color:gray; margin-top:0;">點擊下方媒體名稱以隱藏該來源的新聞（灰色刪除線代表已隱藏）。</p>
            <div id="src-list" style="max-height: 180px; overflow-y: auto; padding: 10px; border: 1px solid #eee; border-radius: 4px; background: #fafafa;"></div>
        </div>

        <div style="text-align:right;">
            <button class="btn btn-blue" onclick="setModal(false)">完成設定</button>
        </div>
    </div>
</div>

<script>
    let data = {};
    let activeU = "";
    // 初始化 localStorage，確保有 hiddenSources 陣列
    let pref = JSON.parse(localStorage.getItem('pref') || '{"likes":[], "dislikes":[], "kws":[], "hiddenSources":[]}');
    if (!pref.hiddenSources) pref.hiddenSources = [];
    let notes = JSON.parse(localStorage.getItem('notes') || '{}');
    let availableSources = new Set();

    async function init() {
        const r = await fetch('news_data.json?t=' + Date.now());
        data = await r.json();
        
        // 收集所有出現過的新聞來源
        Object.values(data).flat().forEach(n => availableSources.add(n.source));
        // 把隱藏的來源也加進去，以防 JSON 沒抓到但設定裡有
        pref.hiddenSources.forEach(s => availableSources.add(s));
        
        renderNav();
        render('政治'); // 預設頁面
    }

    function renderNav() {
        const nav = document.getElementById('nav-list');
        const cats = [...Object.keys(data), "❤️ 收藏"];
        nav.innerHTML = cats.map(c => `<div class="nav-item" onclick="render('${c}')">${c}</div>`).join('');
    }

    function render(c) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        event?.target?.classList?.add('active');

        document.getElementById('cat-title').innerText = c;
        const list = document.getElementById('news-list');
        let items = (c === "❤️ 收藏") ? Object.values(data).flat().filter(n => pref.likes.includes(n.link)) : (data[c] || []);
        
        // 渲染收藏頁面 (加入大型筆記區塊)
        if (c === "❤️ 收藏") {
            if (items.length === 0) { list.innerHTML = "<p>目前沒有收藏的新聞。</p>"; return; }
            
            // 收藏頁面不套用來源過濾，保留所有已收藏的內容
            list.innerHTML = items.map(n => `
                <div class="news-card">
                    <div class="news-content">
                        <div class="news-meta">${n.source} · ${n.time}</div>
                        <a href="${n.link}" target="_blank" class="news-title">${n.title}</a>
                        
                        <!-- 專屬筆記區塊 -->
                        <div class="fav-note-box">
                            <div style="font-size:0.75rem; font-weight:bold; color:#777; margin-bottom:5px;">📋 筆記欄</div>
                            <textarea placeholder="點此直接編輯筆記..." oninput="saveInlineN('${n.link}', this.value)">${notes[n.link] || ''}</textarea>
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:8px; min-width:100px;">
                        <button class="btn btn-blue" onclick="window.open('${n.link}')">🌐 閱讀原文</button>
                        <button class="btn" onclick="openP('${n.link}')">👁️ 預覽視窗</button>
                        <button class="btn btn-red" onclick="handle('like','${n.link}')">取消收藏</button>
                    </div>
                </div>
            `).join('');
            return;
        }

        // 渲染一般分類頁面 (套用來源與不感興趣過濾)
        list.innerHTML = items.map(n => {
            if (pref.dislikes.includes(n.link)) return '';
            if (pref.hiddenSources.includes(n.source)) return ''; // 過濾來源

            const matched = pref.kws.filter(k => n.title.includes(k));
            const isLiked = pref.likes.includes(n.link);

            return `
                <div class="news-card">
                    <div class="news-content">
                        <div class="news-meta">${n.source} · ${n.time}</div>
                        <a href="${n.link}" target="_blank" class="news-title">${n.title}</a>
                        <div style="font-size:0.9rem; color:#666; margin-bottom: 8px;">${n.summary}</div>
                        <div>${matched.map(k => `<span class="kw-tag">#${k}</span>`).join('')}</div>
                    </div>
                    <div style="display:flex; gap:8px; align-items:flex-start;">
                        <button class="btn ${isLiked ? 'btn-blue' : ''}" onclick="handle('like','${n.link}')">❤️ 收藏</button>
                        <button class="btn" onclick="handle('dis','${n.link}')">👎 隱藏</button>
                        <button class="btn" onclick="openP('${n.link}')">👁️ 預覽</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 操作偏好設定
    function handle(type, u) {
        if(type==='like') {
            if(pref.likes.includes(u)) pref.likes = pref.likes.filter(x=>x!==u);
            else pref.likes.push(u);
        } else {
            pref.dislikes.push(u);
        }
        localStorage.setItem('pref', JSON.stringify(pref));
        render(document.getElementById('cat-title').innerText);
    }

    // 側邊預覽面板操作
    function openP(u) {
        activeU = u;
        document.getElementById('preview-pane').classList.add('open');
        document.getElementById('ifr').src = u;
        document.getElementById('note-in').value = notes[u] || "";
    }
    function toggleP(s) { if(!s) document.getElementById('preview-pane').classList.remove('open'); }
    
    // 筆記存檔
    function saveN() {
        notes[activeU] = document.getElementById('note-in').value;
        localStorage.setItem('notes', JSON.stringify(notes));
        // 如果目前在收藏頁面，即時更新列表中的筆記框
        if(document.getElementById('cat-title').innerText === "❤️ 收藏") render("❤️ 收藏");
    }
    function saveInlineN(link, val) {
        notes[link] = val;
        localStorage.setItem('notes', JSON.stringify(notes));
    }

    // 管理面板與來源過濾邏輯
    function setModal(s) {
        document.getElementById('m').style.display = s ? 'block' : 'none';
        if(s) {
            // 渲染關鍵字
            document.getElementById('kw-list').innerHTML = pref.kws.map((k,i)=>`
                <span class="tag-btn">${k} <span style="cursor:pointer;color:red;margin-left:5px;font-weight:bold;" onclick="remKw(${i})">✕</span></span>
            `).join('');

            // 渲染來源過濾按鈕
            const sourcesArr = Array.from(availableSources).sort();
            document.getElementById('src-list').innerHTML = sourcesArr.map(src => {
                const isHidden = pref.hiddenSources.includes(src);
                return `<span class="source-btn ${isHidden ? 'hidden-src' : ''}" onclick="toggleSrc('${src}')">${src}</span>`;
            }).join('');
        }
    }

    // 切換隱藏/顯示來源
    function toggleSrc(src) {
        if(pref.hiddenSources.includes(src)) {
            pref.hiddenSources = pref.hiddenSources.filter(s => s !== src);
        } else {
            pref.hiddenSources.push(src);
        }
        localStorage.setItem('pref', JSON.stringify(pref));
        setModal(true); // 重新渲染按鈕狀態
        render(document.getElementById('cat-title').innerText); // 重新渲染背景列表
    }

    document.getElementById('kw-in').onkeypress = function(e) {
        if(e.key==='Enter' && this.value.trim()) {
            pref.kws.push(this.value.trim());
            this.value='';
            localStorage.setItem('pref', JSON.stringify(pref));
            setModal(true);
            render(document.getElementById('cat-title').innerText);
        }
    }
    function remKw(i) {
        pref.kws.splice(i,1);
        localStorage.setItem('pref', JSON.stringify(pref));
        setModal(true);
        render(document.getElementById('cat-title').innerText);
    }

    // 拖曳縮放邏輯
    const resizer = document.getElementById('resizer');
    const pane = document.getElementById('preview-pane');
    resizer.addEventListener('mousedown', (e) => {
        document.addEventListener('mousemove', resize);
        document.addEventListener('mouseup', () => document.removeEventListener('mousemove', resize));
    });
    function resize(e) {
        const w = window.innerWidth - e.clientX;
        if(w > 300 && w < window.innerWidth * 0.8) pane.style.width = w + 'px';
    }

    init();
</script>
</body>
</html>
